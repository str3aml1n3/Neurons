plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.neurons'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.str3aml1n3.neurons'
        minSdk 23
        targetSdk 36
        versionCode providers.environmentVariable('RELEASE_VERSION_CODE').getOrElse('1').toInteger()
        versionName '1.0'
    }

    if (System.getenv('RELEASE_KEYSTORE')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('RELEASE_KEYSTORE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}
