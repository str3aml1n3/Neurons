<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#060b17">
    <meta name="description" content="An interactive Three.js toy: voxel neurons grow, connect and learn from dopamine.">
    <title>Neurons</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <section id="scene-wrap" aria-label="Rotatable cube of growing neurons">
        <canvas id="scene"></canvas>
      </section>

      <header class="hud top">
        <div class="title">
          <p class="eyebrow">Interactive neural toy</p>
          <h1>Neurons</h1>
        </div>
        <div class="digit-card" aria-label="Current digit">
          <strong id="digit">0</strong>
          <span>0–4 <b class="small">small</b><br>5–9 <b class="big">big</b></span>
        </div>
        <button id="reset" type="button" aria-label="Reset simulation">Reset</button>
      </header>

      <footer class="hud bottom">
        <p id="status" aria-live="polite">Growing connections</p>
        <p class="stats">
          <span id="score">Correct 0 / 0</span>
          <span id="recent">Last 50: –</span>
          <span id="synapses">Synapses 0</span>
        </p>
        <ul class="legend" aria-label="Legend">
          <li><i class="swatch neuron"></i>Neuron</li>
          <li><i class="swatch dendrite"></i>Dendrite (in)</li>
          <li><i class="swatch axon"></i>Axon (out)</li>
          <li><i class="swatch synapse"></i>Synapse</li>
          <li><i class="swatch inhibitory"></i>Inhibitory</li>
          <li><i class="swatch spike"></i>Signal</li>
          <li><i class="swatch dark"></i>Dark signal</li>
          <li><i class="swatch small"></i>Small</li>
          <li><i class="swatch big"></i>Big</li>
        </ul>
        <p class="hint">Drag to rotate · pinch or scroll to zoom</p>
      </footer>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.171.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
