name: Publish prototype

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Positive version code greater than every previously uploaded version"
        required: true
        type: string
      publish:
        description: "Upload to Google Play internal testing (otherwise build only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: play-internal-prototype
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release inputs and prepare upload key
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/neurons-upload.jks
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( RELEASE_VERSION_CODE > 2100000000 )); then
            echo "version_code must be between 1 and 2100000000" >&2
            exit 1
          fi
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name" >&2; exit 1; fi
          done
          if [ "$PUBLISH" = true ] && [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing required secret: PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          keytool -exportcert -rfc -keystore "$RELEASE_KEYSTORE" \
            -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" \
            -file "$RUNNER_TEMP/upload-certificate.pem"
          keytool -printcert -file "$RUNNER_TEMP/upload-certificate.pem"
      - name: Build signed prototype
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/neurons-upload.jks
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify release signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Save signed prototype and public certificate
        uses: actions/upload-artifact@v4.6.2
        with:
          name: neurons-release-${{ inputs.version_code }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/upload-certificate.pem
          if-no-files-found: error
      - name: Publish to internal testing
        if: inputs.publish
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.str3aml1n3.neurons
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/neurons-upload.jks"
