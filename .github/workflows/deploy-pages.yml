name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/configure-pages@v5.0.0
      # GitHub Pages caches files for 10 minutes. Stamping asset URLs with the
      # commit hash makes a normal reload pick up a new deploy immediately.
      - name: Cache-bust asset URLs
        run: |
          version="${GITHUB_SHA::8}"
          sed -i -e "s#\./app\.js\"#./app.js?v=${version}\"#" \
                 -e "s#\./styles\.css\"#./styles.css?v=${version}\"#" web/index.html
          grep -q "app.js?v=${version}" web/index.html
          grep -q "styles.css?v=${version}" web/index.html
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
